services:
  backend:
    build:
      context: ./Backend
    volumes:
      - ./Backend:/app

  llm:
    build:
      context: ./LLM
    volumes:
      - ./LLM:/app
    ports:
      - "8001:8001"

  db:
    image: pgvector/pgvector:pg16
    container_name: startup_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./DB/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  db_data: